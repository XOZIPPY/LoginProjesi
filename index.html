<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2d2d2d;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

            .login-card h2 {
                margin-bottom: 24px;
                font-size: 24px;
                text-align: center;
                color: #ffffff;
            }

        .input-group {
            margin-bottom: 18px;
        }

            .input-group label {
                display: block;
                margin-bottom: 6px;
                font-size: 13px;
                color: #aaa;
            }

            .input-group input {
                width: 100%;
                padding: 12px;
                background: #121212;
                border: 1px solid #333;
                border-radius: 6px;
                color: #fff;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
            }

                .input-group input:focus {
                    border-color: #2563eb;
                }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

            .btn-submit:hover {
                background: #1d4ed8;
            }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }

            .register-link a {
                color: #60a5fa;
                text-decoration: none;
                font-weight: bold;
            }

                .register-link a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>PORTAL.</h2>
        <form action="/anasayfa.html" method="GET">
            <div class="input-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" placeholder="ornek@mail.com" required>
            </div>
            <div class="input-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Giriş Yap</button>
        </form>
        <div class="register-link">
            Hesabın yok mu? <a href="register.html">Kayıt Ol</a>
        </div>
    </div>

</body>
</html>
