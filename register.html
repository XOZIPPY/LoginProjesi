<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Kayıt Ol</h2>

        <div id="hata-mesaji" style="display: none; color: red;"></div>

        <form id="registerForm">
            <div>
                <label for="regEmail">E-posta:</label>
                <input type="email" id="regEmail" placeholder="ornek@mail.com" required>
            </div>
            <div>
                <label for="regPassword">Şifre:</label>
                <input type="password" id="regPassword" required>
            </div>
            <button type="submit">Kayıt Ol</button>
        </form>
        <p>Zaten hesabın var mı? <a href="index.html">Giriş Yap</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
